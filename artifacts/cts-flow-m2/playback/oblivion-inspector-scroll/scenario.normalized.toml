[scenario]
id = "oblivion-inspector-scroll"
name = "Scroll the inspector pane without moving the main stack"
viewport = { width = 1280, height = 360 }
section = "oblivion"
tab = "execution-roadmap"
selectedCard = "markdown-first-roadmap"

[output]
captureFinalPng = true
captureTraceJson = true
captureManifest = true

[[steps]]
type = "wheel"
target = "inspector-pane"
deltaY = 360

[[assertions]]
type = "scroll-offset-changed"
target = "inspector-pane"
reason = "Wheel input over the inspector pane must update inspector-local scroll so review can stay anchored on the selected card."

[[assertions]]
type = "scroll-offset-equals"
target = "main-stack"
value = 0
reason = "Inspector scrolling must not mutate the main card-stack offset; this preserves the independent M15 scroll-pane contract."
