[scenario]
id = "m15d-expanded-reading-surface"
name = "M15d keeps expanded Markdown in the stack and raw source in the inspector"
viewport = { width = 1280, height = 540 }
section = "oblivion"
tab = "execution-roadmap"
selectedCard = "markdown-first-roadmap"
inspectorScroll = 220

[output]
captureFinalPng = true
captureTraceJson = true
captureManifest = true

[[steps]]
type = "click"
target = "card-header"
card = "markdown-first-roadmap"

[[steps]]
type = "wheel"
target = "expanded-body"
card = "markdown-first-roadmap"
deltaY = 360

[[assertions]]
type = "card-expanded"
card = "markdown-first-roadmap"
value = true
reason = "This guards the M15d reading-surface move where the formatted Markdown body lives inline in the stack rather than inside the inspector."

[[assertions]]
type = "region-exists"
target = "expanded-body"
card = "markdown-first-roadmap"
reason = "This guards the M15d document-scale expanded body region in the main stack."

[[assertions]]
type = "region-exists"
target = "raw-source"
card = "markdown-first-roadmap"
reason = "This guards the M15d inspector contract where raw Markdown source remains available in the inspector while the formatted body stays in the stack."

[[assertions]]
type = "scroll-offset-changed"
target = "expanded-body"
card = "markdown-first-roadmap"
reason = "Wheel input over the M15d expanded reading surface must move the card-local body scroll offset."
