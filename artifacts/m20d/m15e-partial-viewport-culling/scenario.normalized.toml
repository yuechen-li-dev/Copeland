[scenario]
id = "m15e-partial-viewport-culling"
name = "M15e keeps partially visible expanded Markdown content alive"
viewport = { width = 1280, height = 360 }
section = "oblivion"
tab = "execution-roadmap"
selectedCard = "markdown-first-roadmap"
expandedCard = "markdown-first-roadmap"
mainStackScroll = 180

[output]
captureFinalPng = true
captureTraceJson = true
captureManifest = true

[[steps]]
type = "wheel"
target = "expanded-body"
card = "markdown-first-roadmap"
deltaY = 360

[[steps]]
type = "wheel"
target = "expanded-body"
card = "markdown-first-roadmap"
deltaY = 360

[[assertions]]
type = "scroll-offset-changed"
target = "expanded-body"
card = "markdown-first-roadmap"
reason = "This guards the M15e partial viewport path by moving the expanded body to a mid-document offset instead of leaving it at the top."

[[assertions]]
type = "region-exists"
target = "expanded-body"
card = "markdown-first-roadmap"
reason = "This guards the M15e regression where partially visible Markdown blocks could disappear entirely instead of remaining visibly clipped inside the expanded body viewport."
