[scenario]
id = "oblivion-expanded-body-scroll"
name = "Expand a Markdown doc and scroll its expanded body"
viewport = { width = 1280, height = 720 }
section = "oblivion"
tab = "execution-roadmap"
selectedCard = "selected-doc-dogfood"

[output]
captureFinalPng = true
captureTraceJson = true
captureManifest = true

[[steps]]
type = "click"
target = "card-header"
card = "selected-doc-dogfood"

[[steps]]
type = "wheel"
target = "expanded-body"
card = "selected-doc-dogfood"
deltaY = 360

[[assertions]]
type = "card-expanded"
card = "selected-doc-dogfood"
value = true
reason = "Clicking a Markdown card header should expand the card so the stack becomes the primary reading surface."

[[assertions]]
type = "scroll-offset-changed"
target = "expanded-body"
card = "selected-doc-dogfood"
reason = "Wheel input over an expanded Markdown body should move that body's local scroll offset."
