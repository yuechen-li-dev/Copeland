[scenario]
id = "oblivion-expand-collapse"
name = "Expand a Markdown doc card, then collapse it with Escape"
viewport = { width = 1280, height = 720 }
section = "oblivion"
tab = "docs"
selectedCard = "doc-aurelian-build-topology-m13b"

[output]
captureFinalPng = true
captureTraceJson = true
captureManifest = true

[[steps]]
type = "click"
target = "card-header"
card = "doc-aurelian-build-topology-m13b"

[[steps]]
type = "key"
key = "Escape"

[[assertions]]
type = "selected-card"
value = "doc-aurelian-build-topology-m13b"
reason = "Expanding and collapsing a Markdown card should preserve the selected card so the inspector keeps following the same document."

[[assertions]]
type = "card-expanded"
card = "doc-aurelian-build-topology-m13b"
value = false
reason = "Escape should collapse the selected expanded Markdown card so keyboard users can leave reading mode without using the mouse."
