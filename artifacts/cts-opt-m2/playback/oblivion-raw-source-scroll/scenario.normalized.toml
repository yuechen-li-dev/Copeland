[scenario]
id = "oblivion-raw-source-scroll"
name = "Expand a Markdown doc and scroll the raw-source inspector region"
viewport = { width = 1280, height = 360 }
section = "oblivion"
tab = "docs"
selectedCard = "doc-aurelian-build-topology-m13b"
expandedCard = "doc-aurelian-build-topology-m13b"
inspectorScroll = 240

[output]
captureFinalPng = true
captureTraceJson = true
captureManifest = true

[[steps]]
type = "wheel"
target = "raw-source"
card = "doc-aurelian-build-topology-m13b"
deltaY = 360

[[assertions]]
type = "region-exists"
target = "raw-source"
card = "doc-aurelian-build-topology-m13b"
reason = "The selected Markdown card should expose a raw-source inspector region after M15d."

[[assertions]]
type = "scroll-offset-changed"
target = "raw-source"
card = "doc-aurelian-build-topology-m13b"
reason = "Wheel input over the raw Markdown source region should move its local scroll offset without reopening editing."
