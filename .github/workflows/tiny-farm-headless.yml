name: TinyFarm headless semantic and TSON content proofs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  semantic-proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build headless and graphical game
        shell: pwsh
        run: dotnet build TinyFarm.slnx -c Release --nologo

      - name: Test headless game
        shell: pwsh
        run: dotnet test TinyFarm.slnx -c Release --no-build --nologo

      - name: Run canonical week, replay, and multi-save proof
        shell: pwsh
        run: |
          $proofPath = Join-Path $env:RUNNER_TEMP "tiny-farm-m2-proof.json"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --proof-json $proofPath
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm canonical proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath $proofPath | ConvertFrom-Json
          if ($proof.Outcome -ne "A" -or
              -not $proof.RepeatedRunMatches -or
              -not $proof.ResultSequenceMatches -or
              -not $proof.EventSequenceMatches -or
              $proof.FinalDay -ne 7 -or
              $proof.PlayerTurnips -ne 0 -or
              $proof.NpcPurchases -lt 1 -or
              ($proof.SaveReloadPoints.PSObject.Properties.Value -contains $false)) {
            throw "TinyFarm proof did not satisfy the M2 semantic contract."
          }

          if ((Get-Item -LiteralPath $proofPath).Length -gt 262144) {
            throw "TinyFarm proof exceeded the compact artifact budget."
          }

      - name: Run graphical semantic projection proof without a window
        shell: pwsh
        run: |
          $proofPath = Join-Path $env:RUNNER_TEMP "tiny-farm-m3-proof.json"
          $projectionPath = Join-Path $env:RUNNER_TEMP "tiny-farm-m3-projection.json"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m3 --proof-json $proofPath --projection-json $projectionPath
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M3 projection proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath $proofPath | ConvertFrom-Json
          if ($proof.Outcome -ne "A" -or
              -not $proof.M1HashPreserved -or
              -not $proof.M2HashPreserved -or
              -not $proof.SameSnapshotProjectionMatches -or
              -not $proof.NpcMovementProjected -or
              -not $proof.SaveLoadProjectionRestored -or
              -not $proof.FarmingLoopCompleted -or
              $proof.RendererOwnsGameplayState) {
            throw "TinyFarm M3 proof did not satisfy the projection boundary."
          }

          $responses = @("inspect", "quit") |
            dotnet run --project src/TinyFarm/TinyFarm.MonoGame/TinyFarm.MonoGame.csproj -c Release --no-build -- --llm-control |
            ForEach-Object { $_ | ConvertFrom-Json }
          if ($responses.Count -ne 3 -or
              $responses[0].status -ne "ready" -or
              $responses[1].status -ne "inspect" -or
              $responses[2].status -ne "quit") {
            throw "TinyFarm LLM control protocol smoke test failed."
          }

      - name: Validate TSON scene content and canonical M7 parity
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m7"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m7 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M7 TSON scene proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              -not $proof.tsonOnlySceneAuthority -or
              -not $proof.legacyParity -or
              -not $proof.navigationParity -or
              -not $proof.anchorParity -or
              -not $proof.routeParity -or
              -not $proof.npcScheduleParity -or
              -not $proof.handoffParity -or
              -not $proof.saveLoadCompatible -or
              $proof.m1Hash -ne "dcc35869aba0eba979725b1871d0babfe127383123a1a5f665b666bc3488d333" -or
              $proof.m2Hash -ne "4a49e221d6ffe90304143cece5b1a20fe96eecc4d10d30cf1bde11922a18ced3") {
            throw "TinyFarm M7 proof did not preserve the scene semantic contract."
          }

      - name: Validate Dominatus schedule selection and canonical M8 parity
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m8"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m8 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M8 Dominatus schedule proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              -not $proof.exhaustiveMinuteParity -or
              -not $proof.sevenDayParity -or
              -not $proof.transitionBoundaryParity -or
              -not $proof.activeInactiveParity -or
              -not $proof.saveLoadBeforeTransition -or
              -not $proof.saveLoadAfterTransition -or
              -not $proof.saveLoadWhileMoving -or
              -not $proof.m6M7HashesPreserved -or
              $proof.sceneContentHash -ne "fe79f373643e1e3aa5df8f505e775cce7388206332831497fe12f8bed7e54afa" -or
              $proof.m1Hash -ne "dcc35869aba0eba979725b1871d0babfe127383123a1a5f665b666bc3488d333" -or
              $proof.m2Hash -ne "4a49e221d6ffe90304143cece5b1a20fe96eecc4d10d30cf1bde11922a18ced3") {
            throw "TinyFarm M8 proof did not preserve the schedule semantic contract."
          }

      - name: Validate TSON schedule content and canonical M9 parity
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m9"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m9 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M9 TSON schedule proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              -not $proof.productionTsonLoaded -or
              -not $proof.rowReorderPreserved -or
              -not $proof.exhaustiveM8Parity -or
              -not $proof.sevenDayParity -or
              -not $proof.activeInactiveParity -or
              -not $proof.handoffParity -or
              -not $proof.saveLoadParity -or
              -not $proof.hardcodedProductionRowsRemoved -or
              $proof.rawTsonLeaksIntoDecisionRuntime -or
              $proof.scheduleDecisionHash -ne "10cdca5bf32bb96bf26d42abbc8ec8feb85983286fab35361c1c979a906796f6" -or
              $proof.anchorSequenceHash -ne "d763164039f2841ff6694f597df0610875ada968d0ad28a0fb9f76469fe59711" -or
              $proof.navigationHash -ne "07dde9ac2f6c957017abe151320ee0a7d5c900f51ecd7901331c9d21a480d8fa" -or
              $proof.sceneContentHash -ne "fe79f373643e1e3aa5df8f505e775cce7388206332831497fe12f8bed7e54afa" -or
              $proof.m1Hash -ne "dcc35869aba0eba979725b1871d0babfe127383123a1a5f665b666bc3488d333" -or
              $proof.m2Hash -ne "4a49e221d6ffe90304143cece5b1a20fe96eecc4d10d30cf1bde11922a18ced3") {
            throw "TinyFarm M9 proof did not preserve the authored schedule contract."
          }

      - name: Validate payload-enum hybrid M10 scheduling
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m10"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m10 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M10 hybrid schedule proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              $proof.comparedMigrationDecisions -ne 30240 -or
              -not $proof.payloadEnumScheduleDay -or
              -not $proof.m9MigrationParity -or
              -not $proof.allRequiredParity -or
              -not $proof.requiredSkipsUtility -or
              -not $proof.openIsBounded -or
              -not $proof.openIsStateSensitive -or
              -not $proof.hardOverride -or
              -not $proof.activeInactiveParity -or
              -not $proof.saveLoadParity -or
              $proof.m1Hash -ne "dcc35869aba0eba979725b1871d0babfe127383123a1a5f665b666bc3488d333" -or
              $proof.m2Hash -ne "4a49e221d6ffe90304143cece5b1a20fe96eecc4d10d30cf1bde11922a18ced3" -or
              $proof.sceneContentHash -ne "fe79f373643e1e3aa5df8f505e775cce7388206332831497fe12f8bed7e54afa" -or
              $proof.m9DecisionHash -ne "10cdca5bf32bb96bf26d42abbc8ec8feb85983286fab35361c1c979a906796f6" -or
              $proof.m9AnchorSequenceHash -ne "d763164039f2841ff6694f597df0610875ada968d0ad28a0fb9f76469fe59711") {
            throw "TinyFarm M10 proof did not preserve the hybrid scheduling contract."
          }

      - name: Validate persistent Open M11 runtime
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m11"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m11 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M11 persistent Open runtime proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              $proof.gameplayBehaviorChanged -or
              -not $proof.openDecisionRuntimePersistent -or
              $proof.candidateLookupAllocates -or
              -not $proof.traceMaterializationOptIn -or
              -not $proof.perActorMutableStateIsolated -or
              $proof.requiredPathChanged -or
              $proof.scheduleContentChanged -or
              $proof.dominatusDecisionSemanticsChanged -or
              $proof.candidateLookupBytesPerDecision -ne 0 -or
              $proof.openBytesPerDecision -gt 640 -or
              $proof.m1Hash -ne "dcc35869aba0eba979725b1871d0babfe127383123a1a5f665b666bc3488d333" -or
              $proof.m2Hash -ne "4a49e221d6ffe90304143cece5b1a20fe96eecc4d10d30cf1bde11922a18ced3" -or
              $proof.sceneContentHash -ne "fe79f373643e1e3aa5df8f505e775cce7388206332831497fe12f8bed7e54afa" -or
              $proof.m9DecisionHash -ne "10cdca5bf32bb96bf26d42abbc8ec8feb85983286fab35361c1c979a906796f6" -or
              $proof.m9AnchorSequenceHash -ne "d763164039f2841ff6694f597df0610875ada968d0ad28a0fb9f76469fe59711" -or
              $proof.m11SemanticParityHash -ne "43bf45523928223698a477ed64349ce73241a7df7fb23a04f33255a0f3124bd6") {
            throw "TinyFarm M11 proof did not preserve the persistent runtime contract."
          }

          $artifactFiles = @(Get-ChildItem -LiteralPath $artifactDirectory -File)
          if ($artifactFiles.Count -ne 5 -or
              ($artifactFiles | Where-Object Length -gt 262144)) {
            throw "TinyFarm M11 evidence exceeded the compact five-file artifact budget."
          }

      - name: Validate Energy and Rest M12 behavior
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m12"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m12 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M12 Energy and Rest proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              -not $proof.personalHomesValid -or
              -not $proof.highEnergyNonRest -or
              -not $proof.lowEnergyRest -or
              -not $proof.requiredOverridesUtility -or
              -not $proof.requiredSkipsUtility -or
              -not $proof.activeRestValid -or
              -not $proof.inactiveRestValid -or
              -not $proof.saveLoadValid -or
              -not $proof.repeatDeterministic -or
              -not $proof.headless -or
              $proof.candidateLookupBytes -ne 0 -or
              $proof.energyScorerBytes -ne 0 -or
              $proof.openBytes -gt 640 -or
              $proof.m1Hash -ne "dcc35869aba0eba979725b1871d0babfe127383123a1a5f665b666bc3488d333" -or
              $proof.m2Hash -ne "4a49e221d6ffe90304143cece5b1a20fe96eecc4d10d30cf1bde11922a18ced3" -or
              $proof.sceneContentHash -ne "7c40c8070ce4a944fd7fbd655d6d9eda607397d19215ca873fd4b039353be600" -or
              $proof.scheduleContentHash -ne "d5f62e2fab9e22d1cb717f6d8e26a9423f657065682a37937c32e5a3260e2564") {
            throw "TinyFarm M12 proof did not satisfy the Energy and Rest contract."
          }

          $expectedFiles = @("behavior.json", "energy.json", "homes.json", "manifest.json", "proof.json")
          $artifactFiles = @(Get-ChildItem -LiteralPath $artifactDirectory -File | Sort-Object Name)
          if ($artifactFiles.Count -ne 5 -or
              (Compare-Object $expectedFiles $artifactFiles.Name) -or
              ($artifactFiles | Where-Object Length -gt 262144)) {
            throw "TinyFarm M12 evidence exceeded the compact five-file artifact budget."
          }

          $controlOutput = @("scenario low-open", "inspect", "quit") |
            dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m12-control |
            Out-String
          if ($LASTEXITCODE -ne 0 -or
              $controlOutput -notmatch '"energy": 1000' -or
              $controlOutput -notmatch '"value": "mara.home-bed"') {
            throw "TinyFarm M12 CLI control smoke test failed."
          }

      - name: Validate M13 simulation host and controls
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m13"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m13 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M13 simulation-host proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              $proof.reuseDecision -ne "TINYFARM_LOCAL_HOST_ONLY" -or
              -not $proof.pausedFreezes -or
              -not $proof.playRateExact -or
              -not $proof.fastForwardRateExact -or
              -not $proof.sixtyVsOneFortyFourEquivalent -or
              -not $proof.irregularEquivalent -or
              -not $proof.saveLoadResetsAccumulator -or
              -not $proof.fatigueRestRecoveryDeparture -or
              -not $proof.m12Regression) {
            throw "TinyFarm M13 proof did not satisfy the simulation-host contract."
          }

          $expectedFiles = @("manifest.json", "proof.json", "rates.json", "simulation-dto.tson", "timing.json")
          $artifactFiles = @(Get-ChildItem -LiteralPath $artifactDirectory -File | Sort-Object Name)
          if ($artifactFiles.Count -ne 5 -or
              (Compare-Object $expectedFiles $artifactFiles.Name) -or
              ($artifactFiles | Where-Object Length -gt 262144)) {
            throw "TinyFarm M13 evidence exceeded the compact five-file artifact budget."
          }

          $controlOutput = @("play", "host-ms 5000", "fast-forward", "advance 2", "pause", "quit") |
            dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m13-control |
            Out-String
          if ($LASTEXITCODE -ne 0 -or
              $controlOutput -notmatch '"WorldMinutesAdvanced":1' -or
              $controlOutput -notmatch '"mode":2' -or
              $controlOutput -notmatch '"mode":0') {
            throw "TinyFarm M13 CLI control smoke test failed."
          }

      - name: Validate M14 locomotion parity and M15 allocation bound
        shell: pwsh
        run: |
          $m14Directory = Join-Path $env:RUNNER_TEMP "tiny-farm-m14"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m14 --artifact-dir $m14Directory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M14 locomotion regression failed."
          }

          $m14Proof = Get-Content -Raw -LiteralPath (Join-Path $m14Directory "proof.json") | ConvertFrom-Json
          if ($m14Proof.outcome -ne "A" -or
              -not $m14Proof.sixtyVsOneFortyFourEquivalent -or
              -not $m14Proof.irregularEquivalent -or
              -not $m14Proof.pauseFreezes -or
              -not $m14Proof.resumeContinues -or
              $m14Proof.stateHash -ne "a0d79da0f0590d1c77d1a27bd19494e1ae68dd16ae8c46caccb20dfcbcb8fd84") {
            throw "TinyFarm M14 canonical locomotion law changed."
          }

          $m15Directory = Join-Path $env:RUNNER_TEMP "tiny-farm-m15"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m15 --artifact-dir $m15Directory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M15 allocation proof failed."
          }

          $m15Proof = Get-Content -Raw -LiteralPath (Join-Path $m15Directory "proof.json") | ConvertFrom-Json
          $allocations = Get-Content -Raw -LiteralPath (Join-Path $m15Directory "allocations.json") | ConvertFrom-Json
          if ($m15Proof.outcome -ne "A" -or
              -not $m15Proof.allocationBounded -or
              -not $m15Proof.semanticMovementCoreSingleSource -or
              -not $m15Proof.canonicalM14HashPreserved -or
              $m15Proof.movementAuthorityChanged -or
              $m15Proof.resolverBypassed -or
              $m15Proof.publicIntentSemanticsChanged -or
              $m15Proof.eventSemanticsChanged -or
              $allocations.sample.runtime.bytesPerReduction -ge 1024 -or
              $allocations.sample.core.bytesPerReduction -ge 128) {
            throw "TinyFarm M15 did not preserve authority within its allocation budgets."
          }

          $expectedFiles = @("allocations.json", "manifest.json", "parity.json", "performance.json", "proof.json")
          $artifactFiles = @(Get-ChildItem -LiteralPath $m15Directory -File | Sort-Object Name)
          if ($artifactFiles.Count -ne 5 -or
              (Compare-Object $expectedFiles $artifactFiles.Name) -or
              ($artifactFiles | Where-Object Length -gt 262144)) {
            throw "TinyFarm M15 evidence exceeded the compact five-file artifact budget."
          }

          $m16Directory = Join-Path $env:RUNNER_TEMP "tiny-farm-m16"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m16 --artifact-dir $m16Directory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M16 inventory/hotbar proof failed."
          }

          $m16Proof = Get-Content -Raw -LiteralPath (Join-Path $m16Directory "proof.json") | ConvertFrom-Json
          $m16Manifest = Get-Content -Raw -LiteralPath (Join-Path $m16Directory "manifest.json") | ConvertFrom-Json
          if ($m16Proof.outcome -ne "A" -or
              -not $m16Proof.inventoryOpenDoesNotMutateGameTruth -or
              -not $m16Proof.saveLoadSelectedSlotExact -or
              $m16Proof.selectedAfterKeyboard -ne 2 -or
              $m16Proof.selectedAfterClick -ne 3 -or
              $m16Manifest.inventoryAuthorityMoved -or
              $m16Manifest.uiMutatesGameplayDirectly -or
              -not $m16Manifest.numberKeysOwnHotbarSelection -or
              -not $m16Manifest.simulationControlConflictResolved) {
            throw "TinyFarm M16 semantic UI authority law changed."
          }

          $controlOutput = @("inspect", "select-slot 2", "inspect", "quit") |
            dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m16-control |
            Out-String
          if ($LASTEXITCODE -ne 0 -or
              $controlOutput -notmatch '"selectedHotbarSlot": 2' -or
              $controlOutput -notmatch '"semanticId": "turnip-seed"') {
            throw "TinyFarm M16 CLI inspection/select-slot smoke test failed."
          }

          $expectedFiles = @("host-integration.json", "input-routing.json", "manifest.json", "proof.json", "ui-projection.json")
          $artifactFiles = @(Get-ChildItem -LiteralPath $m16Directory -File | Sort-Object Name)
          if ($artifactFiles.Count -ne 5 -or
              (Compare-Object $expectedFiles $artifactFiles.Name) -or
              ($artifactFiles | Where-Object Length -gt 262144)) {
            throw "TinyFarm M16 evidence exceeded the compact five-file artifact budget."
          }

          $m17Directory = Join-Path $env:RUNNER_TEMP "tiny-farm-m17"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m17 --artifact-dir $m17Directory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M17 pickup/use-selected proof failed."
          }

          $m17Proof = Get-Content -Raw -LiteralPath (Join-Path $m17Directory "proof.json") | ConvertFrom-Json
          $m17Manifest = Get-Content -Raw -LiteralPath (Join-Path $m17Directory "manifest.json") | ConvertFrom-Json
          if ($m17Proof.outcome -ne "A" -or
              -not $m17Proof.pickupUsesResolver -or
              -not $m17Proof.useSelectedLowersToExistingIntent -or
              -not $m17Proof.plantParity -or
              -not $m17Proof.saveLoadExact -or
              -not $m17Proof.headlessRepeatExact -or
              $m17Manifest.worldItemAuthorityMoved -or
              $m17Manifest.inventoryAuthorityMoved -or
              $m17Manifest.uiMutatesInventoryDirectly -or
              $m17Manifest.genericItemFrameworkAdded) {
            throw "TinyFarm M17 resolver authority law changed."
          }

          $controlOutput = @("inspect", "pickup", "select-slot 1", "use-selected", "inspect", "quit") |
            dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m17-control |
            Out-String
          if ($LASTEXITCODE -ne 0 -or
              $controlOutput -notmatch 'ItemTaken' -or
              $controlOutput -notmatch 'CropPlanted' -or
              $controlOutput -notmatch '"crop": "turnip"') {
            throw "TinyFarm M17 CLI pickup/use-selected smoke test failed."
          }

          $expectedFiles = @("manifest.json", "pickup.json", "proof.json", "ui-projection.json", "use-selected.json")
          $artifactFiles = @(Get-ChildItem -LiteralPath $m17Directory -File | Sort-Object Name)
          if ($artifactFiles.Count -ne 5 -or
              (Compare-Object $expectedFiles $artifactFiles.Name) -or
              ($artifactFiles | Where-Object Length -gt 262144)) {
            throw "TinyFarm M17 evidence exceeded the compact five-file artifact budget."
          }

          $m18Directory = Join-Path $env:RUNNER_TEMP "tiny-farm-m18"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m18 --artifact-dir $m18Directory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M18 foraging proof failed."
          }

          $m18Proof = Get-Content -Raw -LiteralPath (Join-Path $m18Directory "proof.json") | ConvertFrom-Json
          $m18Manifest = Get-Content -Raw -LiteralPath (Join-Path $m18Directory "manifest.json") | ConvertFrom-Json
          if ($m18Proof.outcome -ne "A" -or
              -not $m18Proof.forageUsesResolver -or
              -not $m18Proof.stackableProductProducedFromWorld -or
              -not $m18Proof.nodeDepletionAuthoritative -or
              -not $m18Proof.saveLoadExact -or
              -not $m18Proof.headlessRepeatExact -or
              -not $m18Proof.replayExact -or
              $m18Manifest.inventoryAuthorityMoved -or
              $m18Manifest.rendererMutatesForage -or
              $m18Manifest.randomSpawningAdded -or
              $m18Manifest.resourceFrameworkAdded -or
              $m18Manifest.craftingAdded -or
              $m18Manifest.toolSystemAdded -or
              $m18Manifest.skillSystemAdded) {
            throw "TinyFarm M18 resolver and scope laws changed."
          }

          $controlOutput = @("inspect", "interact", "gather", "inspect", "quit") |
            dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m18-control |
            Out-String
          if ($LASTEXITCODE -ne 0 -or
              $controlOutput -notmatch 'ForageGathered' -or
              $controlOutput -notmatch 'AlreadyDepleted' -or
              $controlOutput -notmatch '"semanticId": "hen-of-the-woods"' -or
              $controlOutput -notmatch '"count": 1') {
            throw "TinyFarm M18 CLI gather/depletion smoke test failed."
          }

          $expectedFiles = @("forage.json", "inventory.json", "manifest.json", "proof.json", "replay.json")
          $artifactFiles = @(Get-ChildItem -LiteralPath $m18Directory -File | Sort-Object Name)
          if ($artifactFiles.Count -ne 5 -or
              (Compare-Object $expectedFiles $artifactFiles.Name) -or
              ($artifactFiles | Where-Object Length -gt 262144)) {
            throw "TinyFarm M18 evidence exceeded the compact five-file artifact budget."
          }

          $m19Directory = Join-Path $env:RUNNER_TEMP "tiny-farm-m19"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m19 --artifact-dir $m19Directory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M19 cooking proof failed."
          }

          $m19Proof = Get-Content -Raw -LiteralPath (Join-Path $m19Directory "proof.json") | ConvertFrom-Json
          $m19Manifest = Get-Content -Raw -LiteralPath (Join-Path $m19Directory "manifest.json") | ConvertFrom-Json
          if ($m19Proof.outcome -ne "A" -or
              -not $m19Proof.recipeAuthoredInTson -or
              -not $m19Proof.cookUsesResolver -or
              -not $m19Proof.atomicIngredientTransformation -or
              -not $m19Proof.saveLoadExact -or
              -not $m19Proof.replayExact -or
              -not $m19Proof.repeatExact -or
              $m19Manifest.inventoryAuthorityMoved -or
              $m19Manifest.genericCraftingGraphAdded -or
              $m19Manifest.recipeEditorAdded -or
              $m19Manifest.qualitySystemAdded -or
              $m19Manifest.skillSystemAdded -or
              $m19Manifest.foodEffectsAdded) {
            throw "TinyFarm M19 resolver and scope laws changed."
          }

          $controlOutput = @("inspect", "interact", "cook", "inspect", "quit") |
            dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m19-control |
            Out-String
          if ($LASTEXITCODE -ne 0 -or
              $controlOutput -notmatch 'RecipeCooked' -or
              $controlOutput -notmatch 'MissingIngredient' -or
              $controlOutput -notmatch 'sauteed-hen-of-the-woods' -or
              $controlOutput -notmatch 'Need Hen-of-the-Woods x1') {
            throw "TinyFarm M19 CLI cooking/conflict smoke test failed."
          }

          $expectedFiles = @("cooking.json", "inventory.json", "manifest.json", "proof.json", "recipes.json")
          $artifactFiles = @(Get-ChildItem -LiteralPath $m19Directory -File | Sort-Object Name)
          if ($artifactFiles.Count -ne 5 -or
              (Compare-Object $expectedFiles $artifactFiles.Name) -or
              ($artifactFiles | Where-Object Length -gt 262144)) {
            throw "TinyFarm M19 evidence exceeded the compact five-file artifact budget."
          }

          $m20Directory = Join-Path $env:RUNNER_TEMP "tiny-farm-m20"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m20 --artifact-dir $m20Directory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M20 woodcutting proof failed."
          }

          $m20Proof = Get-Content -Raw -LiteralPath (Join-Path $m20Directory "proof.json") | ConvertFrom-Json
          $m20Manifest = Get-Content -Raw -LiteralPath (Join-Path $m20Directory "manifest.json") | ConvertFrom-Json
          if ($m20Proof.outcome -ne "A" -or
              -not $m20Proof.saveLoadExact -or
              -not $m20Proof.replayExact -or
              -not $m20Proof.repeatExact -or
              -not $m20Proof.useSelectedParity -or
              -not $m20Manifest.toolUsesIdentityItem -or
              -not $m20Manifest.hotbarSupportsItemBinding -or
              -not $m20Manifest.useSelectedLowersToChop -or
              -not $m20Manifest.chopUsesResolver -or
              -not $m20Manifest.treeDepletionAuthoritative -or
              $m20Manifest.axeDurabilityAdded -or
              $m20Manifest.toolStatsAdded -or
              $m20Manifest.skillSystemAdded -or
              $m20Manifest.genericToolFrameworkAdded -or
              $m20Manifest.genericResourceFrameworkAdded -or
              $m20Manifest.combatAdded) {
            throw "TinyFarm M20 resolver and scope laws changed."
          }

          $controlOutput = @("inspect", "use-selected", "select-slot 3", "use-selected", "chop", "inspect", "quit") |
            dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m20-control |
            Out-String
          if ($LASTEXITCODE -ne 0 -or
              $controlOutput -notmatch 'WrongTool' -or
              $controlOutput -notmatch 'TreeChopped' -or
              $controlOutput -notmatch 'AlreadyDepleted' -or
              $controlOutput -notmatch '"semanticId": "wood"' -or
              $controlOutput -notmatch '"count": 1') {
            throw "TinyFarm M20 CLI selected-Axe/chop/depletion smoke test failed."
          }

          $expectedFiles = @("hotbar.json", "manifest.json", "parity.json", "proof.json", "woodcutting.json")
          $artifactFiles = @(Get-ChildItem -LiteralPath $m20Directory -File | Sort-Object Name)
          if ($artifactFiles.Count -ne 5 -or
              (Compare-Object $expectedFiles $artifactFiles.Name) -or
              ($artifactFiles | Where-Object Length -gt 262144)) {
            throw "TinyFarm M20 evidence exceeded the compact five-file artifact budget."
          }

      - name: Enforce repository artifact budget
        shell: pwsh
        run: ./tools/Test-ArtifactBudget.ps1 -Paths @()
