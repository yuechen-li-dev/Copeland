name: TinyFarm current game headless checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  headless-game:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Copeland
    steps:
      - uses: actions/checkout@v4
        with:
          path: Copeland

      # Match the sibling layout used by the current game's project references.
      # Pin the dependency revisions qualified with this workflow.
      - uses: actions/checkout@v4
        with:
          repository: yuechen-li-dev/Deliverance
          ref: 97523cc09f054bd566e8348c7118e83009c740b2
          path: Deliverance
      - uses: actions/checkout@v4
        with:
          repository: yuechen-li-dev/Dominatus
          ref: 7b52df3024656ec811b9b1ceb4208cd2464eb6ab
          path: Dominatus
      - uses: actions/checkout@v4
        with:
          repository: yuechen-li-dev/InputMan
          ref: f55011e77e9f869441a4be977c4304de97c7332c
          path: InputMan

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build current game and tests
        run: dotnet build TinyFarm.slnx -c Release --nologo -m:1 -nr:false -p:UseSharedCompilation=false

      - name: Test current game and spatial contracts
        run: dotnet test TinyFarm.slnx -c Release --no-build --nologo --logger trx --results-directory "$env:RUNNER_TEMP/tinyfarm-ci/tests"

      - name: Play shell input and supper chapter headlessly
        run: |
          foreach ($scenario in @('shell', 'supper')) {
            $output = Join-Path $env:RUNNER_TEMP "tinyfarm-ci/$scenario"
            dotnet run --project Games/TinyFarm/TinyFarm/TinyFarm.csproj -c Release --no-build -- --headless --playtest-script "Games/TinyFarm/Playtests/$scenario-headless.json" --output $output --save-root "$output/saves"
            if ($LASTEXITCODE -ne 0) {
              throw "TinyFarm $scenario headless playtest failed."
            }
          }

      - name: Upload test and playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinyfarm-headless-evidence
          path: |
            ${{ runner.temp }}/tinyfarm-ci/**/*.trx
            ${{ runner.temp }}/tinyfarm-ci/**/*.json
            ${{ runner.temp }}/tinyfarm-ci/**/*.jsonl
          if-no-files-found: ignore
