name: TinyFarm headless semantic and TSON content proofs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  semantic-proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build headless and graphical game
        shell: pwsh
        run: dotnet build TinyFarm.slnx -c Release --nologo

      - name: Test headless game
        shell: pwsh
        run: dotnet test TinyFarm.slnx -c Release --no-build --nologo

      - name: Run canonical week, replay, and multi-save proof
        shell: pwsh
        run: |
          $proofPath = Join-Path $env:RUNNER_TEMP "tiny-farm-m2-proof.json"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --proof-json $proofPath
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm canonical proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath $proofPath | ConvertFrom-Json
          if ($proof.Outcome -ne "A" -or
              -not $proof.RepeatedRunMatches -or
              -not $proof.ResultSequenceMatches -or
              -not $proof.EventSequenceMatches -or
              $proof.FinalDay -ne 7 -or
              $proof.PlayerTurnips -ne 0 -or
              $proof.NpcPurchases -lt 1 -or
              ($proof.SaveReloadPoints.PSObject.Properties.Value -contains $false)) {
            throw "TinyFarm proof did not satisfy the M2 semantic contract."
          }

          if ((Get-Item -LiteralPath $proofPath).Length -gt 262144) {
            throw "TinyFarm proof exceeded the compact artifact budget."
          }

      - name: Run graphical semantic projection proof without a window
        shell: pwsh
        run: |
          $proofPath = Join-Path $env:RUNNER_TEMP "tiny-farm-m3-proof.json"
          $projectionPath = Join-Path $env:RUNNER_TEMP "tiny-farm-m3-projection.json"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m3 --proof-json $proofPath --projection-json $projectionPath
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M3 projection proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath $proofPath | ConvertFrom-Json
          if ($proof.Outcome -ne "A" -or
              -not $proof.M1HashPreserved -or
              -not $proof.M2HashPreserved -or
              -not $proof.SameSnapshotProjectionMatches -or
              -not $proof.NpcMovementProjected -or
              -not $proof.SaveLoadProjectionRestored -or
              -not $proof.FarmingLoopCompleted -or
              $proof.RendererOwnsGameplayState) {
            throw "TinyFarm M3 proof did not satisfy the projection boundary."
          }

          $responses = @("inspect", "quit") |
            dotnet run --project src/TinyFarm/TinyFarm.MonoGame/TinyFarm.MonoGame.csproj -c Release --no-build -- --llm-control |
            ForEach-Object { $_ | ConvertFrom-Json }
          if ($responses.Count -ne 3 -or
              $responses[0].status -ne "ready" -or
              $responses[1].status -ne "inspect" -or
              $responses[2].status -ne "quit") {
            throw "TinyFarm LLM control protocol smoke test failed."
          }

      - name: Validate TSON scene content and canonical M7 parity
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m7"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m7 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M7 TSON scene proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              -not $proof.tsonOnlySceneAuthority -or
              -not $proof.legacyParity -or
              -not $proof.navigationParity -or
              -not $proof.anchorParity -or
              -not $proof.routeParity -or
              -not $proof.npcScheduleParity -or
              -not $proof.handoffParity -or
              -not $proof.saveLoadCompatible -or
              $proof.m1Hash -ne "dcc35869aba0eba979725b1871d0babfe127383123a1a5f665b666bc3488d333" -or
              $proof.m2Hash -ne "4a49e221d6ffe90304143cece5b1a20fe96eecc4d10d30cf1bde11922a18ced3") {
            throw "TinyFarm M7 proof did not preserve the scene semantic contract."
          }

      - name: Validate Dominatus schedule selection and canonical M8 parity
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m8"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m8 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M8 Dominatus schedule proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              -not $proof.exhaustiveMinuteParity -or
              -not $proof.sevenDayParity -or
              -not $proof.transitionBoundaryParity -or
              -not $proof.activeInactiveParity -or
              -not $proof.saveLoadBeforeTransition -or
              -not $proof.saveLoadAfterTransition -or
              -not $proof.saveLoadWhileMoving -or
              -not $proof.m6M7HashesPreserved -or
              $proof.sceneContentHash -ne "fe79f373643e1e3aa5df8f505e775cce7388206332831497fe12f8bed7e54afa" -or
              $proof.m1Hash -ne "dcc35869aba0eba979725b1871d0babfe127383123a1a5f665b666bc3488d333" -or
              $proof.m2Hash -ne "4a49e221d6ffe90304143cece5b1a20fe96eecc4d10d30cf1bde11922a18ced3") {
            throw "TinyFarm M8 proof did not preserve the schedule semantic contract."
          }

      - name: Validate TSON schedule content and canonical M9 parity
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "tiny-farm-m9"
          dotnet run --project src/TinyFarm/TinyFarm.Runner/TinyFarm.Runner.csproj -c Release --no-build -- --m9 --artifact-dir $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "TinyFarm M9 TSON schedule proof failed."
          }

          $proof = Get-Content -Raw -LiteralPath (Join-Path $artifactDirectory "proof.json") | ConvertFrom-Json
          if ($proof.outcome -ne "A" -or
              -not $proof.productionTsonLoaded -or
              -not $proof.rowReorderPreserved -or
              -not $proof.exhaustiveM8Parity -or
              -not $proof.sevenDayParity -or
              -not $proof.activeInactiveParity -or
              -not $proof.handoffParity -or
              -not $proof.saveLoadParity -or
              -not $proof.hardcodedProductionRowsRemoved -or
              $proof.rawTsonLeaksIntoDecisionRuntime -or
              $proof.scheduleDecisionHash -ne "10cdca5bf32bb96bf26d42abbc8ec8feb85983286fab35361c1c979a906796f6" -or
              $proof.anchorSequenceHash -ne "d763164039f2841ff6694f597df0610875ada968d0ad28a0fb9f76469fe59711" -or
              $proof.navigationHash -ne "07dde9ac2f6c957017abe151320ee0a7d5c900f51ecd7901331c9d21a480d8fa" -or
              $proof.sceneContentHash -ne "fe79f373643e1e3aa5df8f505e775cce7388206332831497fe12f8bed7e54afa" -or
              $proof.m1Hash -ne "dcc35869aba0eba979725b1871d0babfe127383123a1a5f665b666bc3488d333" -or
              $proof.m2Hash -ne "4a49e221d6ffe90304143cece5b1a20fe96eecc4d10d30cf1bde11922a18ced3") {
            throw "TinyFarm M9 proof did not preserve the authored schedule contract."
          }

      - name: Enforce repository artifact budget
        shell: pwsh
        run: ./tools/Test-ArtifactBudget.ps1 -Paths @()
