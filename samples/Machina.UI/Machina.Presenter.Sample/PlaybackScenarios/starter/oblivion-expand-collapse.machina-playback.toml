[scenario]
id = "oblivion-expand-collapse"
name = "Expand a Markdown doc card, then collapse it with Escape"
viewport = { width = 1280, height = 720 }
section = "oblivion"
tab = "execution-roadmap"
selectedCard = "markdown-first-roadmap"

[output]
captureFinalPng = true
captureTraceJson = true
captureManifest = true

[[steps]]
type = "click"
target = "card-header"
card = "markdown-first-roadmap"

[[steps]]
type = "key"
key = "Escape"

[[assertions]]
type = "card-expanded"
card = "markdown-first-roadmap"
value = false
reason = "Escape should collapse the selected expanded Markdown card so keyboard users can leave reading mode without using the mouse."
