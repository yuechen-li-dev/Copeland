format = 1
kind = "card"
id = "oblivion-artifact-placeholder-card"
card_kind = "artifact"
status = "placeholder"
title = "Artifact placeholder"
subtitle = "Export surface placeholder"
tags = ["artifact", "export", "placeholder"]

[body]
format = "plain"
text = """
Future cards can point at PNG, JSON, TOML, or source artifacts.
In M11d these remain metadata only and are not generated by card execution.
"""

[[actions]]
id = "open-artifacts"
label = "Open artifacts"
enabled = false

[[artifacts]]
id = "workspace-manifest"
label = "Workspace manifest"
kind = "json"
asset = "artifacts/workspace-manifest.artifact.toml"

[[artifacts]]
id = "presenter-proof"
label = "Presenter proof"
kind = "png"
asset = "artifacts/presenter-proof.artifact.toml"
