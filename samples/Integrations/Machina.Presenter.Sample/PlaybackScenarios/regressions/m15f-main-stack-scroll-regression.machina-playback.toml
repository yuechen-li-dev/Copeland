[scenario]
id = "m15f-main-stack-scroll-regression"
name = "M15f main-stack wheel regression stays fixed"
viewport = { width = 1280, height = 720 }
section = "oblivion"
tab = "docs"
selectedCard = "doc-aurelian-build-topology-m13b"

[output]
captureFinalPng = true
captureTraceJson = true
captureManifest = true

[[steps]]
type = "wheel"
target = "main-stack"
deltaY = 360

[[assertions]]
type = "scroll-offset-greater-than"
target = "main-stack"
value = 0
reason = "This guards the M15f regression where generic page-scroll clamp forced the wide Oblivion main-stack offset back to zero after wheel dispatch."

[[assertions]]
type = "scroll-offset-equals"
target = "inspector-pane"
value = 0
reason = "This guards the M15f regression fix by proving main-stack wheel input does not leak into inspector scroll state."
