[scenario]
id = "m16b-raw-source-routing-regression"
name = "M16b raw-source wheel routing stays local to raw source"
viewport = { width = 1280, height = 360 }
section = "oblivion"
tab = "docs"
selectedCard = "doc-aurelian-build-topology-m13b"
expandedCard = "doc-aurelian-build-topology-m13b"
inspectorScroll = 240

[output]
captureFinalPng = true
captureTraceJson = true
captureManifest = true

[[steps]]
type = "wheel"
target = "raw-source"
card = "doc-aurelian-build-topology-m13b"
deltaY = 360

[[assertions]]
type = "region-exists"
target = "raw-source"
card = "doc-aurelian-build-topology-m13b"
reason = "This guards the M16b visible-coordinate routing path by requiring the raw-source region to be visibly reachable before wheel playback begins."

[[assertions]]
type = "scroll-offset-changed"
target = "raw-source"
card = "doc-aurelian-build-topology-m13b"
reason = "This guards the M16b coordinate-space bug where raw-source wheel routing fell back to inspector-pane due to visible/root versus interaction-map-local mismatch."

[[assertions]]
type = "scroll-offset-equals"
target = "inspector-pane"
value = 240
reason = "This guards the M16b routing fix by proving raw-source wheel input does not fall back to inspector-pane scrolling after the target is visible."

[[assertions]]
type = "scroll-offset-equals"
target = "main-stack"
value = 0
reason = "This guards the M16b routing fix by proving raw-source wheel input stays local and does not mutate the main stack."
