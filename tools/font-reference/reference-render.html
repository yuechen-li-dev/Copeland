<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Machina Font Reference Render</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            color-scheme: only light;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101018;
            color: #f0f0f0;
            font-family: "Segoe UI", sans-serif;
        }

        body[data-mode="compare"] {
            background:
                radial-gradient(circle at top left, rgba(220, 220, 255, 0.08), transparent 28%),
                #101018;
        }

        .compare-root {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding: 12px;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 10px;
        }

        .compare-title {
            font-size: 13px;
            line-height: 1.3;
            color: #d8d8e8;
        }

        .compare-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-items: start;
        }

        .compare-panel {
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.04);
        }

        .compare-label {
            margin: 0 0 6px 0;
            font-size: 12px;
            color: #c8c8d8;
        }

        .compare-image {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: auto;
            background: #101018;
        }
    </style>
</head>
<body>
    <script src="./reference-render.js"></script>
</body>
</html>
